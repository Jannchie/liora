shellEmulator: true

trustPolicy: no-downgrade
# Only guard fresh releases: old versions hand-published without provenance
# (semver 6.3.1, chokidar 4.0.3, …) are not takeovers.
trustPolicyIgnoreAfter: 43200

overrides:
  '@vercel/nft': ^0.27.4
  punycode: npm:punycode@^2.3.1
  rollup: 4.60.4
  vite: 7.3.3

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  esbuild: false
  ffmpeg-static: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  unrs-resolver: false
  vue-demi: true
