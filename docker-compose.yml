services:
  liora:
    image: docker.io/jannchie/liora:latest
    build: .
    container_name: liora
    ports:
      - '3000:3000'
    environment:
      S3_ENDPOINT: ''
      S3_BUCKET: ''
      S3_ACCESS_KEY_ID: ''
      S3_SECRET_ACCESS_KEY: ''
      ADMIN_USERNAME: ''
      ADMIN_PASSWORD: ''
      ADMIN_SESSION_SECRET: ''
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
